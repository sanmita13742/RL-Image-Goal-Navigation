# MINav Real-World Pipeline Configuration
# ============================================================
# Configuration for the Ranger Mini V3 real-robot exploration
# and training pipeline via ROS 2 Foxy.
#
# Hardware stack (confirmed from rosbag):
#   - Robot:  Ranger Mini V3 via CAN bus (ranger_bringup)
#   - Camera: Intel RealSense (realsense2_camera)
#   - LiDAR:  RoboSense (/rslidar_points)
#   - Odom:   ranger_base /odom at ~50 Hz

run:
  id: null             # auto-generated if null (format: realworld_YYYYMMDD_HHMMSS)
  seed: 42
  device: auto         # auto | cpu | cuda

robot:
  cmd_vel_topic: /minav/cmd_vel
  odom_topic: /odom
  base_frame: base_link
  # Physical action bounds (AGENTS.md):
  max_linear_vel: 1.8       # m/s forward
  min_linear_vel: -0.9      # m/s reverse
  max_lateral_vel: 1.0      # m/s crab walk
  max_angular_vel: 1.5      # rad/s
  dry_run: true              # DEFAULT: never move without explicit --arm

camera:
  topic: /camera/color/image_raw
  encoding: rgb8
  width: 640
  height: 480

lidar:
  topic: /scanner/cloud
  # LiDAR-to-depth projection parameters
  # Project 3D PointCloud2 into a 2D obstacle proximity image
  # matching the MuJoCo depth image interface (H, W) array
  projection_width: 640       # output depth image width
  projection_height: 60       # output depth image height (matches MuJoCo lidar_cam)
  max_range: 10.0             # metres — points beyond this are clipped
  min_range: 0.45             # metres — filter near-field chassis/bumper/camera reflections (chassis front edge is ~0.37m)
  height_min: -0.15            # metres — relative to LiDAR, keep objects >15cm off ground
  height_max: 1.0             # metres — relative to base_link, filter ceiling
  fov_deg: 360.0              # horizontal field of view (RoboSense is 360°)

exploration:
  mode: smart                 # "vanilla" (MINav-faithful) | "smart" (enhanced exploration)
  duration_minutes: 120       # MINav: ~2 hours
  control_freq_hz: 20         # MINav: 20 Hz velocity smoothing
  policy_freq_hz: 1           # 1.0 Hz action sampling (smooth arcs, holds heading for 1.0s)
  smoothing_alpha: 0.15       # LERP blending factor (smoother velocity interpolation)
  segment_size: 1000          # Implementation choice: storage boundary only
  output_subdir: exploration
  pink_noise_beta: 1          # MINav: β=1 pink noise
  # Ranger Dual-Ackermann (unicycle) safe exploration ranges:
  vx_range: [0.20, 0.55]      # m/s — continuous forward rolling momentum
  vy_range: [0.0, 0.0]        # m/s — 0.0 = Dual Ackermann mode (car-like continuous steering, no wheel re-orient halts)
  wz_range: [-0.75, 0.75]     # rad/s — gentle continuous turning curves
  # LiDAR safety gate — Ranger-specific engineering parameters
  safety_gate_min_depth: 0.55 # metres — must be >0.45m (LiDAR min_range blindspot)
  safety_gate_min_pixels: 75  # min near-range pixels per sector to confirm obstacle

  # Smart Exploration Enhancements (active when mode: smart or --mode smart)
  smart:
    action_shaping: true        # Strategy 1: Pre-emptively shape pink noise away from walls
    obstacle_clearance_threshold: 0.65 # metres (slow/steer away threshold)
    tight_space_depth: 0.50            # metres (reverse evasion threshold)
    sector_min_pixels_distance: 25     # min near pixels to trigger distance shaping (noise filter)
    adaptive_speed: true        # Strategy 2: Fast in open corridors, slow crawl in tight zones
    speed_min_dist: 0.65        # metres (crawl speed threshold)
    speed_max_dist: 2.0         # metres (full speed threshold)
    speed_min_scale: 0.20       # crawl speed fraction (0.2x)
    speed_max_scale: 1.00       # full speed fraction (1.0x)
    wz_tight_boost: 1.30        # yaw rotation boost in tight quarters
    panoramic_rotations: false  # Strategy 3: DEFERRED — zero-displacement frames harm hindsight relabeling
    panoramic_interval_s: 180.0 # seconds between injections (3 min)
    panoramic_duration_s: 10.5  # duration (~360 deg at 0.6 rad/s)
    panoramic_speed: 0.60       # rad/s rotation speed
    lidar_observation: false    # Strategy 4: DEFERRED — requires full pipeline surgery (train/export/deploy)
    coverage_nudge: true        # Strategy 5: Lightweight 2D visit grid with angular nudge
    coverage_grid_size: [50, 50]
    coverage_map_meters: 16.0
    coverage_nudge_scale: 0.25  # max rad/s angular bias



safety:
  camera_timeout_s: 3.0       # e-stop if no camera frame for this long
  odom_timeout_s: 5.0         # e-stop if no odom for this long
  lidar_timeout_s: 5.0        # e-stop if no lidar for this long
  watchdog_hz: 5              # safety check frequency

safety_gate:
  input_cmd_topic: /minav/cmd_vel
  output_cmd_topic: /cmd_vel
  lidar_topic: /rslidar_points
  blindspot_radius: 0.15      # Filter out chassis (min radial distance)
  robot_length: 0.751         # Ranger Mini overall footprint length (m)
  robot_width: 0.60           # Ranger Mini footprint width including wheels (m)
  safety_margin: 0.06         # Margin to add around the robot footprint (m)
  lidar_offset_x: 0.0508      # LiDAR offset forward from center (2.5 inches)
  lidar_offset_y: 0.0         # LiDAR offset laterally from center
  min_command_speed: 0.01     # Skip checking for very slow commands
  min_z: -0.2                 # Filter out ground
  max_z: 0.5                  # Ignore ceiling/high overhangs
  stop_distance: 0.25         # Suppress forward if obstacle is within 0.25m (tuned for indoor visual goal docking)
  warning_distance: 0.6
  minimum_points: 10          # Require at least 10 points to confirm obstacle
  cloud_timeout_s: 0.25       # Fail closed if cloud is older than 250ms (<4 Hz cutoff)
  min_lidar_rate_hz: 8.0      # Require >= 8 Hz LiDAR stream
  auto_evade: false           # Pivot away from obstacles when forward translation is blocked (disabled by default)
  evade_angular_speed: 0.5    # Rotation speed (rad/s) to clear corridor

# Downstream pipeline (identical to MuJoCo — reuses same modules)
hindsight:
  dino_model: vit_small_patch16_dinov3
  input_resolution: [448, 784]
  phi_dimension: 384
  ssd_threshold: 0.02
  num_goals: 10
  geometric_p: [0.70, 0.90, 0.99]
  geometric_p_weights: [4, 3, 3]
  frames_per_state: 4
  reward_threshold: 0.8
  done_threshold: 0.8
  critic_geometric_fraction: 0.5
  actor_sampling: uniform
  output_subdir: processed

training:
  batch_size: 1024
  gamma: 0.99
  lambda_bc: 2.5
  lr_actor: 3.0e-5
  lr_critic: 3.0e-4
  policy_delay: 2
  tau: 0.005
  target_noise: 0.1
  target_noise_clip: 0.5
  total_gradient_steps: 20000
  action_scale: [1.8, 1.0, 1.5]
  checkpoint_every: 1000
  fqe_eval_every: 500
  fqe_frequency: 500
  explore_bounds: [[0.0, -0.3, -1.0], [0.6, 0.3, 1.0]]
  output_subdir: training

smoke:
  enabled: false
  exploration_minutes: 0.5
  max_frames: 50
  training_steps: 500
